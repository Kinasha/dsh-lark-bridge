# DSH Host-plane Feishu transport. Install this package into the same profile
# that provides apiProxy (normally the Web profile).

- insert:
    - id: dsh-lark-bridge
      name: '@open-aiden/dsh-lark-bridge'
      inject: [apiProxy, webServer, settings]
      config:
        enabled: !!js process.env.DSH_LARK_ENABLED !== '0'
        workspacePath: !!js process.env.DSH_LARK_WORKSPACE || process.cwd()
        workspaceTitle: !!js process.env.DSH_LARK_WORKSPACE_TITLE
        agentPreset: !!js process.env.DSH_LARK_AGENT_PRESET || 'dsh-lark-safe'
        installBundledPreset: true
        allowedSenderIds: !!js process.env.DSH_LARK_ALLOWED_SENDERS ? process.env.DSH_LARK_ALLOWED_SENDERS.split(',').map(value => value.trim()).filter(Boolean) : null
        blockedSenderIds: !!js process.env.DSH_LARK_BLOCKED_SENDERS ? process.env.DSH_LARK_BLOCKED_SENDERS.split(',').map(value => value.trim()).filter(Boolean) : null
        maxConcurrentTopics: !!js Number(process.env.DSH_LARK_MAX_CONCURRENT_TOPICS || 4)
        maxPendingMessages: !!js Number(process.env.DSH_LARK_MAX_PENDING_MESSAGES || 256)
        eventStatePath: !!js process.env.DSH_LARK_EVENT_STATE_PATH
        eventRetentionMs: !!js Number(process.env.DSH_LARK_EVENT_RETENTION_MS || 604800000)
        enableUserAuth: !!js process.env.DSH_LARK_USER_AUTH_ENABLED !== '0'
        userAuthStatePath: !!js process.env.DSH_LARK_USER_AUTH_STATE_PATH
        userAuthRedirectUri: !!js process.env.DSH_LARK_USER_AUTH_REDIRECT_URI
