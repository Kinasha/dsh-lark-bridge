name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate without publishing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The tag publishes only what the ordinary gate already accepted.
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # creates the GitHub release
      id-token: write # signs the npm provenance attestation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: the tag names the version being published
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $declared" >&2
            exit 1
          fi

      - name: release notes from CHANGELOG.md
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          awk -v section="## [$version]" '
            index($0, section) == 1 { collecting = 1; next }
            /^## / { collecting = 0 }
            collecting { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no notes for $version" >&2
            exit 1
          fi
          cat release-notes.md

      # A fork has no publish token; say so here rather than failing inside npm.
      - name: the publish token is configured
        if: ${{ !inputs.dry_run }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN is not configured for this repository; publishing is disabled" >&2
            exit 1
          fi

      - name: publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: publish the GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack --pack-destination .
          gh release create "$GITHUB_REF_NAME" ./*.tgz \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
