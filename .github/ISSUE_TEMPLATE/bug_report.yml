name: Bug 报告
description: 报告一个可复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请确认：这不是安全漏洞（安全问题请走私密报告通道），
        并且日志与截图已经脱敏（不要包含 App Secret、Token、open ID 或聊天内容）。
  - type: input
    id: version
    attributes:
      label: 插件版本
      placeholder: "0.0.10"
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本
      placeholder: "@deepseek-ai/dsh@0.1.0-rc.7"
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: 运行方式
      options:
        - DSH 插件（dsh web）
        - standalone 本地运行时
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为（含脱敏后的日志）
      render: text
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境
      placeholder: |
        OS: macOS 15 / Ubuntu 24.04
        Node: 22.x
        飞书域: feishu / lark
        相关配置: replyMode=card, progressSurface=cot ...
